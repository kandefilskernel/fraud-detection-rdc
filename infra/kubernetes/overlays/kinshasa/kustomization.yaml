# Zone Kinshasa : plus gros volume de transactions (capitale), capacité de scoring élevée.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud-rdc-kinshasa
resources: [../../base]
labels:
  - pairs: { fraud-rdc/zone: kinshasa }
patches:
  - target: { kind: Namespace, name: fraud-rdc }
    patch: |-
      - { op: replace, path: /metadata/name, value: fraud-rdc-kinshasa }
  - target: { kind: ConfigMap, name: app-config }
    patch: |-
      - { op: replace, path: /data/ZONE, value: kinshasa }
      - { op: replace, path: /data/CORS_ORIGINS, value: "https://kinshasa.fraude.local" }
  - target: { kind: HorizontalPodAutoscaler, name: scoring-service }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 3 }
      - { op: replace, path: /spec/maxReplicas, value: 12 }
  - target: { kind: HorizontalPodAutoscaler, name: integration-layer }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 3 }
      - { op: replace, path: /spec/maxReplicas, value: 12 }
  - target: { kind: Deployment, name: scoring-service }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 3 }
  - target: { kind: Ingress }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: kinshasa.fraude.local }
  # pods applicatifs placés sur les nœuds de la région Kinshasa
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference: { matchExpressions: [{ key: topology.kubernetes.io/region, operator: In, values: [kinshasa] }] }
