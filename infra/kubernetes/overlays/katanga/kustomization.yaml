# Zone Katanga (Lubumbashi, Kolwezi) : bassin minier, forte part de cash-out d'agents
# et de transferts liés aux salaires miniers ; capacité plus modeste.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud-rdc-katanga
resources: [../../base]
labels:
  - pairs: { fraud-rdc/zone: katanga }
patches:
  - target: { kind: Namespace, name: fraud-rdc }
    patch: |-
      - { op: replace, path: /metadata/name, value: fraud-rdc-katanga }
  - target: { kind: ConfigMap, name: app-config }
    patch: |-
      - { op: replace, path: /data/ZONE, value: katanga }
      - { op: replace, path: /data/CORS_ORIGINS, value: "https://katanga.fraude.local" }
  - target: { kind: HorizontalPodAutoscaler, name: scoring-service }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 4 }
  - target: { kind: Ingress }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: katanga.fraude.local }
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference: { matchExpressions: [{ key: topology.kubernetes.io/region, operator: In, values: [katanga] }] }
