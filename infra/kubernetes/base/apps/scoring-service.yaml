apiVersion: v1
kind: Service
metadata: { name: scoring-service, labels: { app: scoring-service } }
spec:
  selector: { app: scoring-service }
  ports: [{ name: http, port: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: scoring-service, labels: { app: scoring-service, tier: app } }
spec:
  replicas: 2
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }   # aucune interruption du scoring
  selector: { matchLabels: { app: scoring-service } }
  template:
    metadata:
      labels: { app: scoring-service, tier: app }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8001" }
    spec:
      initContainers:
        - name: wait-feature-store      # attend que le feature store soit amorcé
          image: redis:7.2-alpine
          command: ["sh", "-c", "until [ \"$(redis-cli -h redis exists fs:meta)\" = 1 ]; do echo attente; sleep 3; done"]
      containers:
        - name: scoring
          image: fraud-rdc/scoring-service
          ports: [{ containerPort: 8001, name: http }]
          envFrom: [{ configMapRef: { name: app-config } }]
          env:
            - { name: SCORING_API_KEYS, valueFrom: { secretKeyRef: { name: app-secrets, key: SCORING_API_KEYS } } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: "1", memory: 768Mi }
            limits: { cpu: "3", memory: 1536Mi }
      topologySpreadConstraints:          # répartit les réplicas sur plusieurs nœuds
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: scoring-service } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: scoring-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: scoring-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: scoring-service }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: scoring-service } }
