apiVersion: v1
kind: Service
metadata: { name: frontend, labels: { app: frontend } }
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, labels: { app: frontend, tier: app } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend, tier: app } }
    spec:
      containers:
        - name: frontend
          image: fraud-rdc/frontend
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: BACKOFFICE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: BACKOFFICE_URL } } }
          readinessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
