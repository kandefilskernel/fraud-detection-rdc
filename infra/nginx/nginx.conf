# Point d'entrée unique (remplace l'ancienne passerelle Python).
#   https://.../           tableau de bord (Next.js, qui relaie /api vers le backoffice)
#   https://.../ingest/... API des opérateurs -> integration-layer (limitation de débit par IP)
#   http://  (port 80)     redirection vers HTTPS ; port 8443 : API opérateurs en mTLS (surcharge)
worker_processes auto;
events { worker_connections 4096; }

http {
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64k;

    log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # 200 requêtes/s par opérateur (IP), rafale de 400 : protège le scoring
    limit_req_zone $binary_remote_addr zone=operators:10m rate=200r/s;
    limit_req_status 429;
    # anti force brute sur la connexion au tableau de bord : 10 essais/min par IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # Adresses des conteneurs résolues en continu par le DNS de Docker (nginx >= 1.27.3) :
    # sans « resolve », nginx garde l'IP vue au démarrage et renvoie 502 dès qu'un service
    # est recréé (docker compose up --build) tant que nginx n'est pas redémarré.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream dashboard   { zone dashboard 64k;   server frontend:3000 resolve;          keepalive 16; }
    upstream integration { zone integration 64k; server integration-layer:8002 resolve; keepalive 64; }
    upstream wallet      { zone wallet 64k;      server wallet-demo:8010 resolve;       keepalive 8; }

    # Extensions montées par des surcharges compose (ex. docker-compose.mtls.yml : port 443
    # avec certificats clients des opérateurs). Dossier vide par défaut.
    include /etc/nginx/extra/*.conf;

    # HTTP : uniquement la sonde de santé ; tout le reste est redirigé vers HTTPS.
    # 308 (et non 301) : la méthode et le corps sont conservés (POST des opérateurs).
    server {
        listen 80;
        location = /healthz { return 200 "ok\n"; }
        location / { return 308 https://$host$request_uri; }
    }

    # HTTPS : tableau de bord, application portefeuille et API des opérateurs (signée HMAC).
    # Certificat de TEST : python scripts/security/generate_dev_pki.py (infra/nginx/certs/).
    # En production : certificat d'une autorité reconnue (Let's Encrypt, ou cert-manager en Kubernetes).
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:web:10m;
        ssl_session_timeout  1d;
        # HSTS volontairement absent en local : sur « localhost » il forcerait HTTPS pour TOUS les
        # ports (Grafana, Mailpit, MLflow...). En production, sur le vrai nom de domaine :
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location /ingest/ {
            limit_req zone=operators burst=400 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;          # liste d'IP autorisées par opérateur
            # pas de certificat client sur ce port : on efface ce qu'un appelant pourrait forger
            proxy_set_header X-Client-Verify "";
            proxy_set_header X-Client-Cert-CN "";
            proxy_read_timeout 2s;
            rewrite ^/ingest/(.*)$ /$1 break;
            proxy_pass http://integration;
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://dashboard;
        }

        location = /healthz { return 200 "ok\n"; }

        # Démonstration : application « portefeuille client » (chemins relatifs dans l'appli)
        location = /portefeuille { return 301 /portefeuille/; }
        location /portefeuille/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            rewrite ^/portefeuille/(.*)$ /$1 break;
            proxy_pass http://wallet;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://dashboard;
        }
    }
}
