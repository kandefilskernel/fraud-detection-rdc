# Point d'entrée unique (remplace l'ancienne passerelle Python).
#   /             tableau de bord (Next.js, qui relaie /api vers le backoffice)
#   /ingest/...   API des opérateurs -> integration-layer (limitation de débit par IP)
worker_processes auto;
events { worker_connections 4096; }

http {
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64k;

    log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # 200 requêtes/s par opérateur (IP), rafale de 400 : protège le scoring
    limit_req_zone $binary_remote_addr zone=operators:10m rate=200r/s;
    limit_req_status 429;

    upstream dashboard   { server frontend:3000; keepalive 16; }
    upstream integration { server integration-layer:8002; keepalive 64; }

    server {
        listen 80;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location /ingest/ {
            limit_req zone=operators burst=400 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 2s;
            rewrite ^/ingest/(.*)$ /$1 break;
            proxy_pass http://integration;
        }

        location = /healthz { return 200 "ok\n"; }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://dashboard;
        }
    }
}
