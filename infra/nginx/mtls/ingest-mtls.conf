# API des opérateurs en mTLS (monté par docker-compose.mtls.yml dans /etc/nginx/extra/).
#
# L'opérateur doit présenter un certificat client signé par l'autorité de la plateforme
# (operators-ca.crt). nginx le vérifie ; son nom commun (CN = vodacom, airtel, orange, visa)
# est transmis à l'integration-layer, qui le compare à l'opérateur de l'URL (REQUIRE_MTLS=true).
# Certificats de TEST : python scripts/security/generate_dev_pki.py

# CN du certificat client, extrait du DN (« CN=vodacom,O=Operateur,C=CD »)
map $ssl_client_s_dn $ssl_client_cn {
    default "";
    "~(^|,)CN=(?<cn>[^,]+)" $cn;
}

server {
    listen 8443 ssl;          # port dédié aux opérateurs (443 = tableau de bord)
    http2 on;

    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_client_certificate  /etc/nginx/certs/operators-ca.crt;
    ssl_verify_client       on;          # pas de certificat valide = connexion refusée
    ssl_verify_depth        2;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_session_cache       shared:mtls:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /ingest/ {
        limit_req zone=operators burst=400 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-Verify $ssl_client_verify;     # SUCCESS si le certificat est valide
        proxy_set_header X-Client-Cert-CN $ssl_client_cn;
        proxy_read_timeout 2s;
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass http://integration;
    }

    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }          # le tableau de bord n'est pas servi sur ce port
}
