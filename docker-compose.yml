# Infrastructure locale : PostgreSQL (+ TimescaleDB), Redis, Redpanda (compatible Kafka).
# Lancement : docker compose up -d        Arrêt : docker compose down
services:
  postgres:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: nuru_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuru_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuru_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuru_admin} -d ${POSTGRES_DB:-fraud_detection_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: nuru_redis
    restart: unless-stopped
    # persistance des profils comportementaux ; mot de passe obligatoire (REDIS_PASSWORD dans .env)
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?définir REDIS_PASSWORD dans .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redpanda : broker compatible API Kafka, un seul conteneur, sans Zookeeper.
  # Depuis les conteneurs : redpanda:9092   —   depuis Windows : localhost:19092
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: nuru_redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Interface web pour voir les topics et messages : http://localhost:8088
  redpanda-console:
    image: redpandadata/console:v2.6.0
    container_name: nuru_redpanda_console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ------------------------------------------------------------------ services applicatifs
  # Amorçage du feature store (une seule fois : ne fait rien si Redis est déjà rempli)
  feature-store-seeder:
    image: fraud-rdc/scoring-service:dev
    build:
      context: .
      dockerfile: services/scoring-service/Dockerfile
    container_name: nuru_seeder
    command: ["python", "-m", "ml.serving.seed_feature_store", "--if-empty"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # doit être identique à l'integration-layer (sinon les clients paraissent inconnus)
      PSEUDONYMIZE_IDS: ${PSEUDONYMIZE_IDS:-false}
      PSEUDONYMIZATION_KEY: ${PSEUDONYMIZATION_KEY:-}
    volumes:
      - ./ml/data:/srv/ml/data:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  scoring-service:
    image: fraud-rdc/scoring-service:dev
    container_name: nuru_scoring
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SCORING_API_KEYS: ${SCORING_API_KEYS:-dev-scoring-key}
    volumes:
      - ./ml/artifacts:/srv/ml/artifacts:ro   # rechargement à chaud après réentraînement
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      feature-store-seeder:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  integration-layer:
    image: fraud-rdc/integration-layer:dev
    build:
      context: .
      dockerfile: services/integration-layer/Dockerfile
    container_name: nuru_integration
    restart: unless-stopped
    environment:
      SCORING_URL: http://scoring-service:8001
      SCORING_API_KEY: ${SCORING_API_KEY:-dev-scoring-key}
      # délai max du scoring avant la politique de repli (VERIFY) ; 0,8 s en production,
      # plus long en local si le PC est chargé (voir .env)
      SCORING_TIMEOUT_S: ${SCORING_TIMEOUT_S:-0.8}
      # pilote silencieux : décisions notées mais jamais appliquées (ex. vodacom,airtel ou all)
      SHADOW_MODE_OPERATORS: ${SHADOW_MODE_OPERATORS:-}
      OPERATOR_API_KEYS: ${OPERATOR_API_KEYS:-vodacom:dev-vodacom-key,airtel:dev-airtel-key,orange:dev-orange-key,visa:dev-visa-key}
      # sécurité des messages : secret HMAC par opérateur, distinct de la clé d'API
      OPERATOR_HMAC_SECRETS: ${OPERATOR_HMAC_SECRETS:-vodacom:dev-vodacom-hmac,airtel:dev-airtel-hmac,orange:dev-orange-hmac,visa:dev-visa-hmac}
      REQUIRE_SIGNATURE: ${REQUIRE_SIGNATURE:-true}
      OPERATOR_IP_ALLOWLIST: ${OPERATOR_IP_ALLOWLIST:-}
      # cadre légal : demo | operator_instance | shared_platform (voir docs/INTEGRATION_OPERATEURS.md)
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-demo}
      OPERATOR_ID: ${OPERATOR_ID:-}
      PSEUDONYMIZE_IDS: ${PSEUDONYMIZE_IDS:-false}
      PSEUDONYMIZATION_KEY: ${PSEUDONYMIZATION_KEY:-}
      # retours des opérateurs -> API interne du back-office
      BACKOFFICE_URL: http://backoffice-api:8003
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      scoring-service:
        condition: service_healthy

  backoffice-api:
    image: fraud-rdc/backoffice-api:dev
    build:
      context: .
      dockerfile: services/backoffice-api/Dockerfile
    container_name: nuru_backoffice
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORS_ORIGINS: http://localhost:3000,http://localhost
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}   # retours des opérateurs
      # assistant d'enquête : sans clé, la note est assemblée sans modèle de langage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Workers Kafka (même image, commande différente)
  worker-persister:
    image: fraud-rdc/workers:dev
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    container_name: nuru_worker_persister
    command: ["python", "-m", "workers.persister"]
    restart: unless-stopped
    env_file: .env
    environment: &worker_env
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on: &worker_deps
      backoffice-api:
        condition: service_healthy   # garantit que les migrations sont appliquées

  worker-alerter:
    image: fraud-rdc/workers:dev
    container_name: nuru_worker_alerter
    command: ["python", "-m", "workers.alerter"]
    restart: unless-stopped
    env_file: .env
    environment: *worker_env
    depends_on: *worker_deps

  worker-auditor:
    image: fraud-rdc/workers:dev
    container_name: nuru_worker_auditor
    command: ["python", "-m", "workers.auditor"]
    restart: unless-stopped
    env_file: .env
    environment: *worker_env
    depends_on: *worker_deps

  frontend:
    image: fraud-rdc/frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nuru_frontend
    restart: unless-stopped
    environment:
      BACKOFFICE_URL: http://backoffice-api:8003
    depends_on:
      backoffice-api:
        condition: service_healthy

  # Démonstration : application « portefeuille client » + serveur opérateur simulé
  # http://localhost/portefeuille/ (ou http://<IP du PC>/portefeuille/ depuis un téléphone)
  wallet-demo:
    image: fraud-rdc/wallet-demo:dev
    build:
      context: .
      dockerfile: services/wallet-demo/Dockerfile
    container_name: nuru_wallet_demo
    restart: unless-stopped
    environment:
      INTEGRATION_URL: http://integration-layer:8002
      OPERATOR_API_KEYS: ${OPERATOR_API_KEYS:-vodacom:dev-vodacom-key,airtel:dev-airtel-key,orange:dev-orange-key,visa:dev-visa-key}
      OPERATOR_HMAC_SECRETS: ${OPERATOR_HMAC_SECRETS:-vodacom:dev-vodacom-hmac,airtel:dev-airtel-hmac,orange:dev-orange-hmac,visa:dev-visa-hmac}
      DATA_DIR: /srv/ml/data/raw
      PREPROCESSING_JSON: /srv/ml/artifacts/preprocessing.json
    volumes:
      - ./ml/data/raw:/srv/ml/data/raw:ro
      - ./ml/artifacts/preprocessing.json:/srv/ml/artifacts/preprocessing.json:ro
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      integration-layer:
        condition: service_healthy

  # Point d'entrée unique : http://localhost (tableau de bord) et http://localhost/ingest/... (opérateurs)
  nginx:
    image: nginx:1.27-alpine
    container_name: nuru_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # certificat HTTPS (test : python scripts/security/generate_dev_pki.py)
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      # 127.0.0.1 par défaut ; BIND_ADDR=0.0.0.0 dans .env pour une démo sur le réseau local
      - "${BIND_ADDR:-127.0.0.1}:80:80"      # redirige vers HTTPS
      - "${BIND_ADDR:-127.0.0.1}:443:443"
    depends_on:
      - frontend
      - integration-layer

  # ------------------------------------------------------------------ supervision
  drift-monitor:
    image: fraud-rdc/ml-jobs:dev
    build:
      context: .
      dockerfile: services/ml-jobs/Dockerfile
    container_name: nuru_drift_monitor
    command: ["python", "-m", "ml.monitoring.drift_detector", "--serve", "--interval", "300"]
    # tâche de fond : basse priorité CPU pour ne pas ralentir le scoring temps réel
    cpu_shares: 256
    cpus: "0.5"
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./ml/artifacts:/srv/ml/artifacts:ro
    depends_on:
      backoffice-api:
        condition: service_healthy

  # Apprentissage continu : réentraîne quand assez d'étiquettes, dérive ou modèle trop ancien
  retrainer:
    image: fraud-rdc/ml-jobs:dev
    container_name: nuru_retrainer
    # tâche de fond : basse priorité CPU pour ne pas ralentir le scoring temps réel
    cpu_shares: 256
    cpus: "1.0"
    command: ["python", "-m", "ml.retraining.scheduler"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PROMETHEUS_URL: http://prometheus:9090
      RETRAIN_CHECK_INTERVAL_S: "600"
      RETRAIN_NEW_LABELS: "500"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./ml/artifacts:/srv/ml/artifacts          # écrit le nouveau champion
      - ./ml/data:/srv/ml/data:ro                 # historique d'entraînement
    depends_on:
      backoffice-api:
        condition: service_healthy

  # Suivi des expériences et registre des modèles : http://localhost:5000
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: nuru_mlflow
    # tâche de fond : basse priorité CPU pour ne pas ralentir le scoring temps réel
    cpu_shares: 256
    cpus: "0.5"
    restart: unless-stopped
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--default-artifact-root", "/mlflow/artifacts"]
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:5000:5000"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: nuru_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: nuru_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-nuru_admin}:${POSTGRES_PASSWORD:-nuru_secure_password_2026}@postgres:5432/${POSTGRES_DB:-fraud_detection_db}?sslmode=disable

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nuru_prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # Tableaux de bord techniques : http://localhost:3001
  grafana:
    image: grafana/grafana:11.2.0
    container_name: nuru_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeMoi-Grafana}
      GF_USERS_DEFAULT_LANGUAGE: fr-FR
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sante-systeme.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # Journaux centralisés : Promtail lit les conteneurs, Loki stocke, Grafana interroge
  loki:
    image: grafana/loki:3.1.1
    container_name: nuru_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: nuru_promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/monitoring/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # Boîte mail locale : les e-mails d'alerte s'affichent sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: nuru_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
  loki_data:
  mlflow_data:
